<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; padding: .5rem; background: #f4f4f4; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" aria-live="polite"></p>
  <section id="result" hidden>
    <p>Тема: <strong id="topic"></strong></p>
    <p>Черновик ответа (проверьте перед отправкой):</p>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цена", other: "Другое" };
    const MESSAGES = {
      manual_review: "Не удалось подготовить ответ автоматически. Разберите заявку вручную.",
      invalid_input: "Введите текст заявки.",
      error: "Сервис недоступен. Попробуйте ещё раз или разберите заявку вручную.",
    };

    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    function show(message, data = null) {
      status.textContent = message;
      topic.textContent = data ? TOPIC_LABELS[data.topic] : "";
      draft.textContent = data ? data.draft : "";
      result.hidden = !data;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      show("Разбираем заявку…");
      button.disabled = true;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const data = await reply.json();
        if (data.status === "ready") show("Готово.", data);
        else show(MESSAGES[data.status] ?? MESSAGES.error);
      } catch {
        show(MESSAGES.error);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
